<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIN's Blog</title>
    <link rel="stylesheet" href="/Blog/style.css">
    <link rel="stylesheet" href="/Blog/share/aichat.css">
    <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
        
        const navbar = document.getElementById('navbar');
        const hero = document.querySelector('.hero');
        const heroHeight = hero.offsetHeight;

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            if (scrollY > heroHeight) {
            navbar.classList.add('scrolled');
            } else {
            navbar.classList.remove('scrolled');
            }
        });
       
    </script>
        <!-- Odometer 数字滚动插件 -->
    <link rel="stylesheet" href="/Blog/odometr.css">
    <script src="/Blog/odometr.js"></script>
    <!-- 博客运行计时核心脚本 -->
    <script>
    window.pjaxLoaded = function(){
        var blog_running_days=document.getElementById("blog_running_days");
        var blog_running_hours=document.getElementById("blog_running_hours");
        var blog_running_mins=document.getElementById("blog_running_mins");
        var blog_running_secs=document.getElementById("blog_running_secs");
        
        function refresh_blog_running_time(){
            // 博客起始时间：2024年10月7日（月份0-11，所以9代表10月）
            var time = new Date() - new Date(2024, 9, 7, 0, 0, 0);
            var d=parseInt(time/24/60/60/1000);
            var h=parseInt(time%(24*60*60*1000)/60/60/1000);
            var m=parseInt(time%(60*60*1000)/60/1000);
            var s=parseInt(time%(60*1000)/1000);
            
            blog_running_days.innerHTML=d;
            blog_running_hours.innerHTML=h;
            blog_running_mins.innerHTML=m;
            blog_running_secs.innerHTML=s;
        };
        
        refresh_blog_running_time();
        if (typeof(bottomTimeIntervalHasSet) == "undefined"){
            var bottomTimeIntervalHasSet = true;
            setInterval(refresh_blog_running_time,500);
        }
    };
    // 初始化数字滚动
    window.onload = function(){
        odometer_init();
        window.pjaxLoaded();
    };

    function odometer_init(){
        let el = document.getElementsByClassName('odometer');
        for (let i = 0; i < el.length; i++) {
            od = new Odometer({
                el: el[i],
                format: 'ddd',
                duration: 200
            });
        }
    }
    </script>

</head>
<body>
    <!-- 背景自动切换 -->
    <div class="bg-slider" id="bgSlider">
        <div class="bg-layer active" style="background-image: url('/Blog/images/bg1.jpg')"></div>
        <div class="bg-layer" style="background-image: url('/Blog/images/bg2.jpg')"></div>
        <div class="bg-layer" style="background-image: url('/Blog/images/bg3.jpg')"></div>
    </div>
    <!-- 萤火虫特效 -->
    <div class="fireflies" id="fireflies"></div>

    <!-- 导航 -->
    <nav class="nav" id="navbar">
        <div class="container">
            <ul class="nav-menu">
                <li><a href="/Blog/index.html">首页</a></li>
                <li><a href="/Blog/sort.html">分类</a></li>
                <li><a href="/Blog/history.html">归档</a></li>
                <li><a href="/Blog/tool.html">工具</a></li>
                <li><a href="/Blog/aboutme.html">关于我</a></li>
            </ul>
        </div>
    </nav>


    <!-- 主体内容 -->
    <main class="aichat-container" id="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-avatar">AI</div>
                <div class="chat-header-info">
                    <h2>派蒙</h2>
                    <p>最好的伙伴</p>
                </div>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div id="statusMessage" class="status-message"></div>
            <div class="input-section">
                <textarea id="chatInput" placeholder="输入消息..." class="chat-input"></textarea>
                <button id="sendBtn" class="send-btn">发送</button>
            </div>
        </div>
    <script src="/Blog/share/aichat.js"></script>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container ">
            <!-- 版权信息 -->
            <div>Copyright © 2024 - 版权归属 LIN</div>
            <!-- 博客运行计时 -->
            <div class="running-time">
                本博客已运行 
                <span id="blog_running_days" class="odometer"></span> days , 
                <span id="blog_running_hours" class="odometer"></span> h , 
                <span id="blog_running_mins" class="odometer"></span> m , 
                <span id="blog_running_secs" class="odometer"></span> s
            </div>
        </div>
    </footer>
    <script>
    // 背景自动切换 + 萤火虫特效
    (function() {
        var layers = document.querySelectorAll('.bg-layer');
        var currentIndex = 0;
        setInterval(function() {
            layers[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % layers.length;
            layers[currentIndex].classList.add('active');
        }, 10000);
        document.body.classList.add('loaded');
    })();
    (function() {
        var container = document.getElementById('fireflies');
        var floatPaths = ['float1', 'float2', 'float3', 'float4'];
        for (var i = 0; i < 50; i++) {
            var wrapper = document.createElement('div');
            wrapper.className = 'firefly-wrapper';
            wrapper.style.top = Math.random() * 100 + '%';
            wrapper.style.left = Math.random() * 100 + '%';
            var floatDuration = 15 + Math.random() * 20;
            var floatDelay = Math.random() * -20;
            var floatPath = floatPaths[Math.floor(Math.random() * 4)];
            wrapper.style.setProperty('--float-duration', floatDuration + 's');
            wrapper.style.setProperty('--float-delay', floatDelay + 's');
            wrapper.style.setProperty('--float-path', floatPath);
            var firefly = document.createElement('div');
            firefly.className = 'firefly';
            var size = 3 + Math.random() * 4;
            firefly.style.width = size + 'px';
            firefly.style.height = size + 'px';
            var breatheDuration = 3 + Math.random() * 5;
            var breatheDelay = Math.random() * -10;
            firefly.style.setProperty('--breathe-duration', breatheDuration + 's');
            firefly.style.setProperty('--breathe-delay', breatheDelay + 's');
            wrapper.appendChild(firefly);
            container.appendChild(wrapper);
        }
    })();
    </script>
</body>
    <script src="https://cdn.jsdelivr.net/gh/huangwb8/bloghelper@latest/mouse/halo-dream/fairyDustCursor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/huangwb8/bloghelper@latest/js/input-with-fire.js"></script>
    <script src="/Blog/pjax.js"></script>
   
</html>
