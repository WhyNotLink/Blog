    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
        
        const navbar = document.getElementById('navbar');
        const hero = document.querySelector('.hero');
        const heroHeight = hero ? hero.offsetHeight : 0;

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            if (scrollY > heroHeight) {
            navbar.classList.add('scrolled');

        <!-- Odometer 数字滚动插件 -->
    <link rel="stylesheet" href="/Blog/odometr.css">

    <!-- 博客运行计时核心脚本 -->
    <script>
    window.pjaxLoaded = function(){
        var blog_running_days=document.getElementById("blog_running_days");
        var blog_running_hours=document.getElementById("blog_running_hours");
        var blog_running_mins=document.getElementById("blog_running_mins");
        var blog_running_secs=document.getElementById("blog_running_secs");
        
        function refresh_blog_running_time(){
            // 博客起始时间：2024年10月7日（月份0-11，所以9代表10月）
            var time = new Date() - new Date(2024, 9, 7, 0, 0, 0);
            var d=parseInt(time/24/60/60/1000);
            var h=parseInt(time%(24*60*60*1000)/60/60/1000);
            var m=parseInt(time%(60*60*1000)/60/1000);
            var s=parseInt(time%(60*1000)/1000);
            
            blog_running_days.innerHTML=d;
            blog_running_hours.innerHTML=h;
            blog_running_mins.innerHTML=m;
            blog_running_secs.innerHTML=s;
        };
        
        refresh_blog_running_time();
        if (typeof(bottomTimeIntervalHasSet) == "undefined"){
            var bottomTimeIntervalHasSet = true;
            setInterval(refresh_blog_running_time,500);
        }
    };
    // 初始化数字滚动
    window.onload = function(){
        odometer_init();
        window.pjaxLoaded();
    };

    function odometer_init(){
        let el = document.getElementsByClassName('odometer');
        for (let i = 0; i < el.length; i++) {
            od = new Odometer({
                el: el[i],
                format: 'ddd',
                duration: 200
            });
        }
    }
    </script>

    <!-- 页面加载控制 - 立即执行 -->
    <script>
    (function() {
        const isFirstVisit = !sessionStorage.getItem('bgLoaded');
        
        document.addEventListener('DOMContentLoaded', function() {
            const loader = document.getElementById('pageLoader');
            
            if (!isFirstVisit) {
                if (loader) loader.style.display = 'none';
                document.body.classList.add('page-fade-in');
                return;
            }
            
            function hideLoader() {
                if (loader) {
                    loader.classList.add('hidden');
                    setTimeout(() => loader.style.display = 'none', 500);
                }
                document.body.classList.add('loaded');
                sessionStorage.setItem('bgLoaded', 'true');
            }
            
            const bgImg = new Image();
            bgImg.src = '/Blog/images/bg1.jpg';
            
            if (bgImg.complete && bgImg.naturalWidth > 0) {
                hideLoader();
            } else {
                bgImg.onload = hideLoader;
                bgImg.onerror = hideLoader;
                setTimeout(hideLoader, 3000);
            }
        });
    })();
    </script>

    <script>
    // 背景自动切换 + 立即显示内容
    (function() {
        const layers = document.querySelectorAll('.bg-layer');
        let currentIndex = 0;
        
        setInterval(() => {
            layers[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % layers.length;
            layers[currentIndex].classList.add('active');
        }, 10000);
        
        document.body.classList.add('loaded');
    })();
    
    // 萤火虫特效
    (function() {
        const container = document.getElementById('fireflies');
        const floatPaths = ['float1', 'float2', 'float3', 'float4'];
        
        for (let i = 0; i < 50; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'firefly-wrapper';
            wrapper.style.top = Math.random() * 100 + '%';
            wrapper.style.left = Math.random() * 100 + '%';
            
            const floatDuration = 15 + Math.random() * 20;
            const floatDelay = Math.random() * -20;
            const floatPath = floatPaths[Math.floor(Math.random() * 4)];
            
            wrapper.style.setProperty('--float-duration', floatDuration + 's');
            wrapper.style.setProperty('--float-delay', floatDelay + 's');
            wrapper.style.setProperty('--float-path', floatPath);
            
            const firefly = document.createElement('div');
            firefly.className = 'firefly';
            const size = 3 + Math.random() * 4;
            firefly.style.width = size + 'px';
            firefly.style.height = size + 'px';
            
            const breatheDuration = 3 + Math.random() * 5;
            const breatheDelay = Math.random() * -10;
            
            firefly.style.setProperty('--breathe-duration', breatheDuration + 's');
            firefly.style.setProperty('--breathe-delay', breatheDelay + 's');
            
            wrapper.appendChild(firefly);
            container.appendChild(wrapper);
        }
    })();
    </script>
